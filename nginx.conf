server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Kamal proxy healthcheck
    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Missing media must 404 instead of falling back to index.html
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
